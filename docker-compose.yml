version: '3.8'

services:
  db:
    image: pgvector/pgvector:16
    container_name: kruschlaw-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kruschlaw_db}
      POSTGRES_USER: ${POSTGRES_USER:-kruschlaw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kruschlaw_secret}
    ports:
      - "${DATABASE_PORT:-5435}:5432"
    volumes:
      - kruschlaw_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kruschlaw} -d ${POSTGRES_DB:-kruschlaw_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: kruschlaw-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-kruschlaw}:${POSTGRES_PASSWORD:-kruschlaw_secret}@db:5432/${POSTGRES_DB:-kruschlaw_db}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_EMBED_HOST=${OLLAMA_EMBED_HOST:-http://host.docker.internal:11434}
      - OLLAMA_LLM_MODEL=${OLLAMA_LLM_MODEL:-qwen2.5-coder:14b}
      - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL:-bge-large}
    ports:
      - "${BACKEND_PORT:-8085}:8000"
    volumes:
      - ./src:/app/src
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: kruschlaw-frontend
    restart: unless-stopped
    environment:
      - BACKEND_URL=${BACKEND_URL:-http://backend:8000}
    ports:
      - "${FRONTEND_PORT:-8505}:8501"
    volumes:
      - ./src:/app/src
    depends_on:
      - backend

volumes:
  kruschlaw_db_data:
