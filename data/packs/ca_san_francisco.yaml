  - citation: "Cal. Civ. Code § 1950.5(c)"
    section_number: "1950.5(c)"
    title: "Residential Security Deposit Limits & Enactment of Assembly Bill 12"
    topic: "Security Deposits"
    authority_class: "controlling_statute"
    hierarchy_level: "subsection"
    effective_date: "2024-07-01"
    source_url: "https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=CIV&sectionNum=1950.5"
    publisher: "California Office of Legislative Counsel"
    edition: "Stats. 2023, ch. 290 (AB 12)"
    raw_content: |
      Under Section 1950.5(c) as amended by Assembly Bill 12 (effective July 1, 2024), a landlord may not demand or receive security, however denominated, in an amount or value in excess of an amount equal to one month's rent, in addition to any rent for the first month paid on or before initial occupancy.

      This one-month rent limitation applies to both unfurnished and furnished residential rental properties. A limited exception exists for a natural person or family LLC owning no more than two residential rental properties that collectively comprise no more than four units, who may demand up to two months' rent unless the tenant is a service member.

      Within 21 calendar days after the tenant has vacated the premises, the landlord shall furnish the tenant with a copy of an itemized statement indicating the basis for, and the amount of, any security received and the disposition of the security, and shall return any remaining portion of the security to the tenant. Bad faith retention of security subjects the landlord to statutory damages of up to twice the amount of the security.
    statutory_slots:
      deposit_cap_months: 1.0
      small_landlord_cap_months: 2.0
      accounting_days: 21
      statutory_damages_multiplier: 2.0

  - citation: "Cal. Civ. Code § 1954.52"
    section_number: "1954.52"
    title: "Costa-Hawkins Rental Housing Act — Statewide Rent Control Preemption"
    topic: "Rent Control & Preemption"
    authority_class: "controlling_statute"
    hierarchy_level: "section"
    effective_date: "1996-01-01"
    source_url: "https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=CIV&sectionNum=1954.52"
    publisher: "California Office of Legislative Counsel"
    edition: "Stats. 1995, ch. 331"
    raw_content: |
      Notwithstanding any other provision of law, an owner of residential real property may establish the initial and all subsequent rental rates for a dwelling or a unit about which any of the following is true:
      (1) It has a certificate of occupancy issued after February 1, 1995.
      (2) It has already been exempt from the residential rent control ordinance of any city, county, or city and county on or before February 1, 1995.
      (3) It is alienable separate from the title to any other dwelling unit, including single-family residences, condominiums, and townhomes.

      Statewide preemption under Costa-Hawkins restricts local rent control ordinances from establishing rent ceilings on post-1995 construction or single-family homes, but preserves local authority over eviction grounds and habitability standards.
    statutory_slots:
      vacancy_decontrol: true
      single_family_exempt: true

  - citation: "Cal. Civ. Code § 1946.2"
    section_number: "1946.2"
    title: "California Tenant Protection Act of 2019 — Statewide Just Cause Evictions"
    topic: "Just Cause Evictions"
    authority_class: "controlling_statute"
    hierarchy_level: "section"
    effective_date: "2020-01-01"
    source_url: "https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=CIV&sectionNum=1946.2"
    publisher: "California Office of Legislative Counsel"
    edition: "Stats. 2019, ch. 597 (AB 1482)"
    raw_content: |
      Notwithstanding any other law, after a tenant has continuously and lawfully occupied a residential real property for 12 months, the owner of the residential real property shall not terminate the tenancy without just cause, which shall be stated in the written notice to terminate tenancy.

      Just cause is divided into At-Fault Just Cause (including nonpayment of rent, material breach of lease, nuisance, waste, refusal to sign a lease extension) and No-Fault Just Cause (including owner move-in, withdrawal from the rental market under the Ellis Act, government compliance orders, or substantial remodeling).

      For a no-fault just cause termination, the owner shall either provide direct relocation assistance equal to one month of the tenant's rent or waive in writing the payment of the final month's rent. Local just cause ordinances adopted on or before September 1, 2019, or local ordinances providing greater tenant protections, are not preempted and remain enforceable under the harmonized floor rule.
    statutory_slots:
      occupancy_threshold_months: 12
      relocation_months: 1.0
      preserves_local_just_cause: true

  - citation: "Cal. Civ. Code § 1947.12"
    section_number: "1947.12"
    title: "California Tenant Protection Act of 2019 — Statewide Rent Increase Caps"
    topic: "Rent Increases"
    authority_class: "controlling_statute"
    hierarchy_level: "section"
    effective_date: "2020-01-01"
    source_url: "https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=CIV&sectionNum=1947.12"
    publisher: "California Office of Legislative Counsel"
    edition: "Stats. 2019, ch. 597 (AB 1482)"
    raw_content: |
      An owner of residential real property shall not, over the course of any 12-month period, increase the gross rental rate for a dwelling or a unit more than 5 percent plus the percentage change in the cost of living (Consumer Price Index), or 10 percent, whichever is lower, of the lowest gross rental rate charged for that dwelling or unit at any time during the 12 months prior to the effective date of the increase.
    statutory_slots:
      base_cap_percent: 5.0
      max_cap_percent: 10.0
      max_increases_per_year: 2

  - citation: "San Francisco Administrative Code § 37.9"
    section_number: "37.9"
    title: "San Francisco Residential Rent Stabilization and Arbitration Ordinance — Evictions"
    topic: "Just Cause Evictions"
    authority_class: "municipal_ordinance"
    hierarchy_level: "section"
    effective_date: "1979-06-13"
    source_url: "https://codelibrary.amlegal.com/codes/san_francisco/latest/sf_admin/0-0-0-21844"
    publisher: "City and County of San Francisco / American Legal Publishing"
    edition: "SF Admin Code Chapter 37 Supp. 2024"
    raw_content: |
      A landlord shall not endeavor to recover possession of a rental unit unless at least one of the following enumerated just cause grounds is demonstrated:
      (1) Failure to pay lawful rent to which the landlord is entitled.
      (2) Habitual failure to pay rent or breach of a material lease covenant after written notice to cure.
      (3) Creating a substantial nuisance or severe damage to the rental unit.
      (4) Illegal use of the rental unit.
      (5) Refusal to execute a written extension or renewal of the lease upon substantially identical terms.
      (6) Refusal to provide landlord reasonable access as required by state law.
      (7) Unapproved subtenant holding over.
      (8) Owner Move-In (OMI): The landlord seeks in good faith, without ulterior motive, to recover possession for use as the principal residence of the landlord or the landlord's grandparent, parent, child, grandchild, or sibling. The landlord must hold at least 25% recorded ownership interest (or 10% if recorded prior to February 21, 1991). The owner or qualifying relative must move into the unit within 3 months and reside there continuously as a principal residence for at least 36 consecutive months. A landlord may not recover possession for OMI if a comparable vacant unit exists in the building.
      (9) Demolition or permanent removal of the unit from housing use.
      (10) Substantial rehabilitation or capital improvement work requiring the unit to be vacant.
      (11) Temporary lead hazard abatement work.
      (12) Demolition or removal under the California Ellis Act (Government Code Section 7060 et seq.).

      Failure to strictly state the statutory just cause grounds, failure to provide mandatory Rent Board notices, or failure to offer comparable vacant units renders any termination notice legally defective and void.
    statutory_slots:
      omi_ownership_percent_floor: 25.0
      omi_occupancy_duration_months: 36
      omi_move_in_window_months: 3
      requires_comparable_unit_audit: true
      just_cause_grounds_count: 16
    preempts: []

  - citation: "San Francisco Administrative Code § 37.9A"
    section_number: "37.9A"
    title: "San Francisco Rent Ordinance — Tenant Rights in No-Fault Displacements & Relocation Payments"
    topic: "Relocation Assistance"
    authority_class: "municipal_ordinance"
    hierarchy_level: "section"
    effective_date: "1986-12-08"
    source_url: "https://codelibrary.amlegal.com/codes/san_francisco/latest/sf_admin/0-0-0-21876"
    publisher: "City and County of San Francisco / American Legal Publishing"
    edition: "SF Admin Code Chapter 37 Supp. 2024"
    raw_content: |
      For any no-fault eviction under Section 37.9(a)(8) (Owner Move-In), Section 37.9(a)(10) (Capital Improvements), or Section 37.9(a)(13) (Ellis Act), the landlord is legally obligated to provide mandatory municipal relocation payments to each authorized tenant occupant.

      Relocation payments are adjusted annually for inflation by the San Francisco Rent Board. For 2024, the baseline relocation payment is $10,500 per eligible tenant (up to a maximum per unit cap), plus an additional statutory payment of $7,000 for each elderly (60 years or older) or disabled tenant occupant.

      One-half of the relocation payment must be paid at the time of service of the notice of termination, and the second half must be paid when the tenant vacates the unit. Failure to tender the mandatory initial relocation installment at service renders the termination notice void ab initio.
    statutory_slots:
      baseline_relocation_payment_min: 10500.0
      protected_tenant_supplement: 7000.0
      senior_age_threshold: 60
      initial_installment_due_at_service: true
      disability_eligible: true

  - citation: "San Francisco Administrative Code § 37.10B"
    section_number: "37.10B"
    title: "San Francisco Tenant Harassment Ordinance — Prohibited Coercive Conduct"
    topic: "Tenant Harassment"
    authority_class: "municipal_ordinance"
    hierarchy_level: "section"
    effective_date: "2008-11-04"
    source_url: "https://codelibrary.amlegal.com/codes/san_francisco/latest/sf_admin/0-0-0-21920"
    publisher: "City and County of San Francisco / American Legal Publishing"
    edition: "Measure M / SF Admin Code Chapter 37"
    raw_content: |
      No landlord, and no agent, contractor, or employee of the landlord, shall in bad faith violate tenant rights or engage in coercive conduct intended to induce a tenant to vacate a rental housing unit. Prohibited conduct includes:
      (1) Interrupting, terminating, or failing to provide housing services required by contract or state or local housing, health, or safety laws.
      (2) Failing to perform repairs and maintenance in a timely manner.
      (3) Abusing the landlord's right of access under California Civil Code Section 1954.
      (4) Influencing or attempting to influence a tenant to vacate through fraud, intimidation, or coercion.
      (5) Threatening to report the tenant or individuals associated with the tenant to immigration authorities.
      (6) Refusing to acknowledge or accept lawful rent payments.
      (7) Interfering with a tenant's right to quiet use and enjoyment of the rental unit.

      An aggrieved tenant may institute a civil action for injunctive relief, actual damages, and statutory civil penalties of not less than $1,000 for each violation. Where the landlord acted in knowing violation or reckless disregard of this Section, actual damages shall be trebled, and the court shall award reasonable attorney's fees to the prevailing tenant.
    statutory_slots:
      minimum_statutory_penalty: 1000.0
      treble_damages_available: true
      prevailing_tenant_attorney_fees: true
      bad_faith_required: true

  - citation: "San Francisco Administrative Code § 37.3"
    section_number: "37.3"
    title: "San Francisco Rent Ordinance — Annual Allowable Rent Increases"
    topic: "Rent Increases"
    authority_class: "municipal_ordinance"
    hierarchy_level: "section"
    effective_date: "1979-06-13"
    source_url: "https://codelibrary.amlegal.com/codes/san_francisco/latest/sf_admin/0-0-0-21780"
    publisher: "City and County of San Francisco / American Legal Publishing"
    edition: "SF Admin Code Chapter 37 Supp. 2024"
    raw_content: |
      An owner of a rental unit covered by the San Francisco Rent Ordinance may impose an annual rent increase only up to the allowable percentage published annually by the Rent Board.

      The allowable annual rent increase is calculated as 60 percent of the percentage increase in the Consumer Price Index (CPI) for all urban consumers in the San Francisco-Oakland-San Jose metropolitan area for the twelve months ending October 31 of the previous year.

      Annual allowable rent increases may not be imposed more frequently than once every twelve months. Unused allowable increases may be accumulated ("banked") subject to strict calculation rules, but no banked increase may be imposed without the mandatory statutory written notice calculating the exact banked percentages for each preceding year.
    statutory_slots:
      cpi_factor_percentage: 60.0
      annual_frequency_limit_months: 12
      banking_allowed: true
      requires_detailed_bank_calculation: true

  - citation: "San Francisco Police Code § 2909"
    section_number: "2909"
    title: "San Francisco Noise Control Ordinance — Residential Property Line Decibel Limits"
    topic: "Noise Restrictions"
    authority_class: "municipal_ordinance"
    hierarchy_level: "section"
    effective_date: "2018-05-10"
    source_url: "https://codelibrary.amlegal.com/codes/san_francisco/latest/sf_police/0-0-0-2909"
    publisher: "City and County of San Francisco / American Legal Publishing"
    edition: "SF Police Code Article 29"
    raw_content: |
      No person shall produce or cause to be produced sound from any source that exceeds the ambient noise level by 5 dBA at the property plane of any residential property between the hours of 10:00 PM and 7:00 AM. Violations constitute a public nuisance and are subject to immediate civil administrative citations.
    statutory_slots:
      ambient_excess_decibel_limit: 5.0
      nighttime_start_hour: 22
      nighttime_end_hour: 7
