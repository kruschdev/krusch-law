name: KruschLaw Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout KruschLaw
        uses: actions/checkout@v4

      - name: Checkout KruschNexus
        uses: actions/checkout@v4
        with:
          repository: kruschdev/krusch-nexus
          path: krusch-nexus

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ./krusch-nexus --no-deps

      - name: Run Unit Tests
        env:
          KRUSCH_NEXUS_DIR: ${{ github.workspace }}/krusch-nexus
          KRUSCH_NEXUS_PATH: ${{ github.workspace }}/krusch-nexus/src
        run: |
          python -m unittest discover tests
