name: KruschLaw Sovereign Legal Engine CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-eval-gate:
    name: Lint, Unit & Golden Evaluation Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr libtesseract-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          pip install -r requirements-backend.txt

      - name: Code Quality & Lint Gate (Ruff)
        run: |
          ruff check .

      - name: Run Test Suite (Unit, Integration, & Pipeline)
        env:
          DATABASE_URL: "sqlite:///:memory:"
          ENVIRONMENT: "development"
        run: |
          python -m unittest discover tests

      - name: Execute Frozen Golden Legal Benchmark (CI Gate)
        env:
          DATABASE_URL: "sqlite:///:memory:"
        run: |
          python scripts/eval_retrieval_and_grounding.py
