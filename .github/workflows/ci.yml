name: KruschLaw CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Nightly pgvector integration job at 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Lint, Test Suite & Golden Evaluation (SQLite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr libtesseract-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          pip install -r requirements-backend.txt
          pip install -r requirements-frontend.txt || true

      - name: Code Quality & Lint Gate (Ruff)
        run: |
          ruff check .

      - name: Run Test Suite (145 Passing Unit & Integration Tests)
        env:
          APP_ENV: development
          ALLOW_LAN: 1
          DATABASE_URL: sqlite:///:memory:
          ENVIRONMENT: test
          HEADLESS_MODE: 1
          USE_MOCK_EMBEDDINGS: 1
        run: |
          pytest tests/ -v

      - name: 60-Second Headless Demo Verification
        env:
          APP_ENV: development
          ALLOW_LAN: 1
          HEADLESS_MODE: 1
          USE_MOCK_EMBEDDINGS: 1
        run: |
          python scripts/demo_60s.py

      - name: Execute Frozen Golden Legal Benchmark (CI Gate)
        env:
          APP_ENV: development
          ALLOW_LAN: 1
          DATABASE_URL: sqlite:///:memory:
          HEADLESS_MODE: 1
          USE_MOCK_EMBEDDINGS: 1
        run: |
          python scripts/eval_retrieval_and_grounding.py

  nightly-pgvector:
    name: Nightly Integration (Postgres + pgvector)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: kruschlaw_test_db
          POSTGRES_USER: kruschlaw
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr libtesseract-dev

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff
          pip install -r requirements-backend.txt psycopg2-binary pgvector

      - name: Run Tests on PostgreSQL + pgvector
        env:
          APP_ENV: development
          ALLOW_LAN: 1
          DATABASE_URL: postgresql://kruschlaw:test_password@localhost:5432/kruschlaw_test_db
          USE_MOCK_EMBEDDINGS: 1
          HEADLESS_MODE: 1
        run: |
          pytest tests/ -v
